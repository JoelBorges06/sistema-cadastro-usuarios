<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <form id="formulario" novalidate>
    <h1>Cadastro</h1>

    <p class="descricao">Crie sua conta para continuar</p>

    <label for="nome">Nome:</label>
    <input
      type="text"
      id="nome"
      name="nome"
      placeholder="Digite seu nome"
    />
    <p id="mensagemNome" class="mensagem-erro"></p>

    <label for="email">E-mail:</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Digite seu e-mail"
    />
    <p id="mensagemEmail" class="mensagem-erro"></p>

    <label for="senha">Senha:</label>

    <div class="campo-senha">
      <input type="password" id="senha" placeholder="Digite sua senha"> <button type="button" id="mostrarSenha" aria-label="Mostrar senha"> 
        <svg id="iconeOlho" xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24"> 
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/> 
        <circle cx="12" cy="12" r="3"/> </svg> </button> </div>
    <p id="mensagemSenha" class="mensagem-erro"></p>

    <button type="submit">Cadastrar</button>

    <p id="mensagemSucesso"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
